name: Playwright Test Automation CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Execution Environment (dev/test/stage/prod)'
        required: true
        default: 'test'
        type: choice
        options: [dev, test, stage, prod]
      application:
        description: 'Application / System under test'
        required: true
        default: 'DEMO'
        type: string
      device:
        description: 'Device type (desktop/mobile/tablet)'
        required: true
        default: 'desktop'
        type: choice
        options: [desktop, mobile, tablet]
      suite:
        description: 'Test Suite Filter (smoke/regression/targetedRegression/all)'
        required: true
        default: 'smoke'
        type: choice
        options: [smoke, regression, targetedRegression, all]
      browser:
        description: 'Browser project engine (chromium/firefox/webkit)'
        required: true
        default: 'chromium'
        type: choice
        options: [chromium, firefox, webkit]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-tests:
    name: Execute Playwright Automated Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, self-hosted]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    env:
      ENV: ${{ github.event.inputs.environment || 'test' }}
      TEST_ENV: ${{ github.event.inputs.environment || 'test' }}
      TEST_APP: ${{ github.event.inputs.application || 'DEMO' }}
      DEVICE: ${{ github.event.inputs.device || 'desktop' }}
      SUITE: ${{ github.event.inputs.suite || 'smoke' }}
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
      CI: true
      DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
      DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      STAGE_USERNAME: ${{ secrets.STAGE_USERNAME }}
      STAGE_PASSWORD: ${{ secrets.STAGE_PASSWORD }}
      PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
      PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Node Modules & Playwright Browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # --- Linux/macOS dependency installation ---
      - name: Install Dependencies & Playwright (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "📦 Installing npm dependencies..."
          npm ci
          echo "🌐 Installing Playwright browsers..."
          npx playwright install --with-deps

      # --- Windows dependency installation ---
      - name: Install Dependencies & Playwright (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Installing npm dependencies..."
          npm ci
          Write-Host "Installing Playwright browsers..."
          npx playwright install

      # --- Run Playwright Tests ---
      - name: Run Playwright Tests
        id: run_playwright_tests
        continue-on-error: true
        shell: bash
        run: |
          echo "=================================================="
          echo "🚀 STARTING PLAYWRIGHT TEST RUN"
          echo "OS          : ${{ matrix.os }}"
          echo "Environment : ${TEST_ENV}"
          echo "Application : ${TEST_APP}"
          echo "Device      : ${DEVICE}"
          echo "Browser     : ${BROWSER}"
          echo "Suite       : ${SUITE}"
          echo "=================================================="

          GREP_ARG=""
          case "${SUITE}" in
            smoke) GREP_ARG='--grep "@Smoke|@smoke"' ;;
            regression) GREP_ARG='--grep "@Regression|@regression"' ;;
            targetedRegression) GREP_ARG='--grep "@TargetedRegression|@targeted"' ;;
            all) GREP_ARG="" ;;
            *) GREP_ARG="" ;;
          esac

          CMD="npx playwright test --project=${BROWSER} ${GREP_ARG}"
          echo "Executing command: ${CMD}"
          eval ${CMD}

      # --- Re-run failed tests ---
      - name: Re-run failed Playwright tests
        id: rerun_failed_tests
        if: steps.run_playwright_tests.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          echo "=================================================="
          echo "🔄 RETRYING FAILED TESTS ONLY (--last-failed)"
          echo "=================================================="

          GREP_ARG=""
          case "${SUITE}" in
            smoke) GREP_ARG='--grep "@Smoke|@smoke"' ;;
            regression) GREP_ARG='--grep "@Regression|@regression"' ;;
            targetedRegression) GREP_ARG='--grep "@TargetedRegression|@targeted"' ;;
            all) GREP_ARG="" ;;
            *) GREP_ARG="" ;;
          esac

          CMD="npx playwright test --last-failed --project=${BROWSER} ${GREP_ARG}"
          echo "Executing rerun command: ${CMD}"
          eval ${CMD}

      # --- Finalize test status ---
      - name: Finalize test status
        if: always()
        shell: powershell
        run: |
          $initial = ${{ steps.run_playwright_tests.outcome }}
          $rerun   = ${{ steps.rerun_failed_tests.outcome }}

          Write-Host "=================================================="
          Write-Host "📊 FINAL TEST STATUS EVALUATION"
          Write-Host "Initial Run Outcome : $initial"
          if ($rerun) {
            Write-Host "Re-run Outcome     : $rerun"
          } else {
            Write-Host "Re-run Outcome     : N/A (Skipped)"
          }
          Write-Host "=================================================="

          if ($initial -eq "failure" -and $rerun -eq "failure") {
            Write-Host "❌ CRITICAL: Initial test run AND rerun both failed."
            exit 1
          } elseif ($initial -eq "failure" -and $rerun -eq "success") {
            Write-Host "⚠️ WARNING: Initial run failed, but rerun passed all failing tests."
            exit 0
          } elseif ($initial -eq "success") {
            Write-Host "✅ SUCCESS: All tests passed on initial execution."
            exit 0
          } else {
            Write-Host "ℹ️ INFO: Workflow completed with initial outcome: $initial"
          }

      # --- Upload Test Artifacts ---
      - name: Upload Test Artifacts and Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}-${{ matrix.os }}
          path: |
            results/test-results
            results/playwright-report
          retention-days: 14

      # --- Publish Test Execution Summary ---
      - name: Publish Test Execution Summary
        if: always()
        shell: powershell
        run: |
          $initial = ${{ steps.run_playwright_tests.outcome }}
          $rerun   = ${{ steps.rerun_failed_tests.outcome }}

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Playwright Test Execution Summary (${{ matrix.os }})"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Property | Value |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| --- | --- |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| **OS** | `${{ matrix.os }}` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| **Environment** | `${env:TEST_ENV}` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| **Application** | `${env:TEST_APP}` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| **Device** | `${env:DEVICE}` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| **Suite** | `${env:SUITE}` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| **Browser** | `${env:BROWSER}` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| **Initial Run Status** | `$initial` |"
