name: Playwright Test Automation CI/CD

# ==============================================================================
# 1. TRIGGER DEFINITIONS
# ==============================================================================
# UPDATE HERE: Customize triggers according to your project's CI/CD strategy.
# - Push / PR triggers can be configured for specific branches (e.g., main, master, develop).
# - Manual trigger (workflow_dispatch) allows dynamic execution via GitHub UI/API.
# ==============================================================================
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner Machine / OS (self-hosted, windows-latest, ubuntu-latest, macos-latest)'
        required: true
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - windows-latest
          - ubuntu-latest
          - macos-latest
      environment:
        description: 'Target Execution Environment (dev/test/stage/prod)'
        required: true
        default: 'test'
        type: choice
        options:
          - dev
          - test
          - stage
          - prod
      application:
        description: 'Application / System under test'
        required: true
        default: 'GOOGLE'
        type: string
      device:
        description: 'Device type (desktop/mobile/tablet)'
        required: true
        default: 'desktop'
        type: choice
        options:
          - desktop
          - mobile
          - tablet
      suite:
        description: 'Test Suite Filter (smoke/regression/targetedRegression/all)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - targetedRegression
          - all
      browser:
        description: 'Browser project engine (chromium/firefox/webkit)'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

# Prevents redundant parallel workflow runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  playwright-tests:
    name: Execute Playwright Automated Tests

    # ==========================================================================
    # 2. VIRTUAL MACHINE (VM) / RUNNER SELECTION
    # ==========================================================================
    # Configured for Windows Self-Hosted Runner (DESKTOP-1HQ5J38) or UI choice.
    # ==========================================================================
    runs-on: ${{ github.event.inputs.runner || 'self-hosted' }}

    # UPDATE HERE: Adjust overall job timeout limit (in minutes) for long-running suites
    timeout-minutes: 120

    # ==========================================================================
    # 3. USER CREDENTIALS & ENVIRONMENT SECRETS
    # ==========================================================================
    # UPDATE HERE: Map your environment credentials stored in GitHub Repository Secrets.
    # Go to: GitHub Repository -> Settings -> Secrets and variables -> Actions
    # Define credentials matching your targeted environments (DEV, TEST, STAGE, PROD).
    # ==========================================================================
    env:
      # General Environment Configuration
      ENV: ${{ github.event.inputs.environment || 'test' }}
      TEST_ENV: ${{ github.event.inputs.environment || 'test' }}
      TEST_APP: ${{ github.event.inputs.application || 'GOOGLE' }}
      DEVICE: ${{ github.event.inputs.device || 'desktop' }}
      SUITE: ${{ github.event.inputs.suite || 'smoke' }}
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
      CI: 'true'

      # Environment Credentials (Injected securely from Repository Secrets)
      # UPDATE HERE: Add, remove, or rename these secrets to match your system secrets
      DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
      DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      STAGE_USERNAME: ${{ secrets.STAGE_USERNAME }}
      STAGE_PASSWORD: ${{ secrets.STAGE_PASSWORD }}
      PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
      PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ========================================================================
      # 4. SYSTEM & DEPENDENCY SETUP
      # ========================================================================
      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps
          npx playwright install chrome

      # ========================================================================
      # 5. INITIAL TEST EXECUTION (CROSS-PLATFORM RUNNER)
      # ========================================================================
      - name: Run Playwright Tests
        id: run_playwright_tests
        continue-on-error: true
        run: |
          node -e "
            const { spawnSync } = require('child_process');
            const os = require('os');
            console.log('==================================================');
            console.log('STARTING PLAYWRIGHT TEST RUN');
            console.log('Machine Name:', '${{ runner.name }} (' + os.hostname() + ')');
            console.log('OS / Arch   :', '${{ runner.os }} (${{ runner.arch }})');
            console.log('Environment :', process.env.TEST_ENV || 'test');
            console.log('Application :', process.env.TEST_APP || 'GOOGLE');
            console.log('Device      :', process.env.DEVICE || 'desktop');
            console.log('Browser     :', process.env.BROWSER || 'chromium');
            console.log('Suite       :', process.env.SUITE || 'smoke');
            console.log('==================================================');

            const suite = (process.env.SUITE || 'smoke').toLowerCase();
            const browser = process.env.BROWSER || 'chromium';
            let grep = '';
            if (suite === 'smoke') grep = '@Smoke|@smoke';
            else if (suite === 'regression') grep = '@Regression|@regression';
            else if (suite === 'targetedregression') grep = '@TargetedRegression|@targeted';

            const npxCmd = process.platform === 'win32' ? 'npx.cmd' : 'npx';
            const args = ['playwright', 'test', '--project=' + browser];
            if (grep) args.push('--grep', grep);

            console.log('Executing:', npxCmd, args.join(' '));
            const res = spawnSync(npxCmd, args, { stdio: 'inherit', shell: false });
            process.exit(res.status || 0);
          "

      # ========================================================================
      # 6. FAILED-TEST RERUN GATE (CROSS-PLATFORM)
      # ========================================================================
      - name: Re-run failed Playwright tests
        id: rerun_failed_tests
        if: steps.run_playwright_tests.outcome == 'failure'
        continue-on-error: true
        run: |
          node -e "
            const { spawnSync } = require('child_process');
            console.log('==================================================');
            console.log('RETRYING FAILED TESTS ONLY (--last-failed)');
            console.log('==================================================');
            const browser = process.env.BROWSER || 'chromium';
            const npxCmd = process.platform === 'win32' ? 'npx.cmd' : 'npx';
            const args = ['playwright', 'test', '--last-failed', '--project=' + browser];

            console.log('Executing rerun:', npxCmd, args.join(' '));
            const res = spawnSync(npxCmd, args, { stdio: 'inherit', shell: false });
            process.exit(res.status || 0);
          "

      # ========================================================================
      # 7. FINAL STATUS EVALUATION GATE (CROSS-PLATFORM)
      # ========================================================================
      - name: Finalize test status
        if: always()
        run: |
          node -e "
            const initial = '${{ steps.run_playwright_tests.outcome }}';
            const rerun = '${{ steps.rerun_failed_tests.outcome }}';
            console.log('==================================================');
            console.log('FINAL TEST STATUS EVALUATION');
            console.log('Initial Run Outcome :', initial);
            console.log('Re-run Outcome     :', rerun || 'N/A (Skipped)');
            console.log('==================================================');

            if (initial === 'failure' && rerun === 'failure') {
              console.error('[CRITICAL] Initial test run AND rerun both failed.');
              process.exit(1);
            } else if (initial === 'failure' && rerun === 'success') {
              console.log('[WARNING] Initial run failed, but rerun passed all failing tests.');
              process.exit(0);
            } else if (initial === 'success') {
              console.log('[SUCCESS] All tests passed on initial execution.');
              process.exit(0);
            } else {
              console.log('[INFO] Workflow completed with initial outcome:', initial);
              process.exit(0);
            }
          "

      # ========================================================================
      # 8. ARTIFACTS AND REPORTING
      # ========================================================================
      # UPDATE HERE: Customize retention days or artifact paths if needed.
      # Default paths: playwright-report, test-results, results
      # ========================================================================
      - name: Upload Test Artifacts and Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            results/playwright-report
            results/test-results
          retention-days: 14

      # ========================================================================
      # 9. GITHUB STEP SUMMARY GENERATION (CROSS-PLATFORM)
      # ========================================================================
      - name: Publish Test Execution Summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const os = require('os');
            const initial = '${{ steps.run_playwright_tests.outcome }}';
            const rerun = '${{ steps.rerun_failed_tests.outcome }}' || 'N/A';
            const machine = os.hostname();
            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            if (!summaryFile) process.exit(0);

            const reportNote = '[Live Report] View report online via GitHub Pages (Repo -> Settings -> Pages -> Source: GitHub Actions) or download artifact below.';
            const markdown = [
              '### Playwright Test Execution Summary',
              '',
              reportNote,
              '',
              '| Property | Value |',
              '| --- | --- |',
              '| **Execution Machine / VM** | \`${{ runner.name }} (' + machine + ')\` |',
              '| **OS / Architecture** | \`${{ runner.os }} (${{ runner.arch }})\` |',
              '| **Environment** | ' + (process.env.TEST_ENV || 'test') + ' |',
              '| **Application** | ' + (process.env.TEST_APP || 'GOOGLE') + ' |',
              '| **Device** | ' + (process.env.DEVICE || 'desktop') + ' |',
              '| **Suite** | ' + (process.env.SUITE || 'smoke') + ' |',
              '| **Browser** | ' + (process.env.BROWSER || 'chromium') + ' |',
              '| **Initial Run Status** | ' + initial + ' |',
              '| **Re-run Status** | ' + rerun + ' |',
              '',
              'Artifacts: Check the summary attachments below for detailed HTML reports, JSON results, screenshots, and traces.'
            ].join('\n');

            fs.appendFileSync(summaryFile, markdown + '\n');
          "

  # ============================================================================
  # DEDICATED GITHUB PAGES DEPLOYMENT JOB (Runs on GitHub Cloud runner)
  # ============================================================================
  deploy-report:
    name: Deploy Playwright HTML Report
    needs: playwright-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - name: Download Playwright Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: playwright-artifacts

      - name: Prepare Report Directory
        run: |
          mkdir -p playwright-report
          if [ -d "playwright-artifacts/playwright-report" ]; then
            cp -r playwright-artifacts/playwright-report/* playwright-report/
          elif [ -d "playwright-artifacts" ]; then
            cp -r playwright-artifacts/* playwright-report/
          fi
          if [ ! -f "playwright-report/index.html" ]; then
            echo "<html><body><h2>Playwright Test Run Complete</h2><p>Check downloadable artifacts for test execution details.</p></body></html>" > playwright-report/index.html
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Playwright HTML Report to GitHub Pages
        id: upload_pages
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: playwright-report

      - name: Deploy Playwright Report to GitHub Pages
        id: deployment
        if: steps.upload_pages.outcome == 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Publish Live Report Link to Summary
        if: always()
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$PAGE_URL" ]; then
            PAGE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          echo "### Live Playwright Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Report URL: $PAGE_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Click here to open Playwright Report in Browser]($PAGE_URL)" >> $GITHUB_STEP_SUMMARY
