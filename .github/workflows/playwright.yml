name: Playwright Test Automation CI/CD

on:
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Execute Playwright Automated Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, self-hosted]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    env:
      TEST_ENV: ${{ github.event.inputs.environment || 'test' }}
      TEST_APP: ${{ github.event.inputs.application || 'DEMO' }}
      DEVICE: ${{ github.event.inputs.device || 'desktop' }}
      SUITE: ${{ github.event.inputs.suite || 'smoke' }}
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
      CI: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Node Modules & Playwright Browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # 🧠 Use bash for Linux/macOS
      - name: Install Dependencies & Playwright Browsers (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "📦 Installing npm dependencies..."
          npm ci
          echo "🌐 Installing Playwright browsers..."
          npx playwright install --with-deps

      # 🧠 Use PowerShell for Windows
      - name: Install Dependencies & Playwright Browsers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "📦 Installing npm dependencies..."
          npm ci
          Write-Host "🌐 Installing Playwright browsers..."
          npx playwright install --with-deps

      - name: Run Playwright Tests
        id: run_playwright_tests
        continue-on-error: true
        shell: bash
        run: |
          echo "🚀 Running Playwright tests on ${{ matrix.os }}"
          npx playwright test --project=${BROWSER}

      - name: Re-run failed Playwright tests
        id: rerun_failed_tests
        if: steps.run_playwright_tests.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          echo "🔄 Retrying failed tests..."
          npx playwright test --last-failed --project=${BROWSER}

      - name: Finalize test status
        if: always()
        shell: bash
        run: |
          INITIAL_OUTCOME="${{ steps.run_playwright_tests.outcome }}"
          RERUN_OUTCOME="${{ steps.rerun_failed_tests.outcome }}"
          echo "📊 Final status: Initial=${INITIAL_OUTCOME}, Rerun=${RERUN_OUTCOME}"

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}-${{ matrix.os }}
          path: |
            results/test-results
            results/playwright-report
          retention-days: 14

      - name: Publish Summary
        if: always()
        shell: bash
        run: |
          echo "### 🎭 Playwright Summary (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **OS** | \`${{ matrix.os }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Browser** | \`${BROWSER}\` |" >> $GITHUB_STEP_SUMMARY
