name: Playwright Test Automation CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Execution Environment (dev/test/stage/prod)'
        required: true
        default: 'test'
        type: choice
        options: [dev, test, stage, prod]
      application:
        description: 'Application / System under test'
        required: true
        default: 'DEMO'
        type: string
      device:
        description: 'Device type (desktop/mobile/tablet)'
        required: true
        default: 'desktop'
        type: choice
        options: [desktop, mobile, tablet]
      suite:
        description: 'Test Suite Filter (smoke/regression/targetedRegression/all)'
        required: true
        default: 'smoke'
        type: choice
        options: [smoke, regression, targetedRegression, all]
      browser:
        description: 'Browser project engine (chromium/firefox/webkit)'
        required: true
        default: 'chromium'
        type: choice
        options: [chromium, firefox, webkit]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-tests:
    name: Execute Playwright Automated Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, self-hosted]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    env:
      TEST_ENV: ${{ github.event.inputs.environment || 'test' }}
      TEST_APP: ${{ github.event.inputs.application || 'DEMO' }}
      DEVICE: ${{ github.event.inputs.device || 'desktop' }}
      SUITE: ${{ github.event.inputs.suite || 'smoke' }}
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
      CI: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Node Modules & Playwright Browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            node_modules
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Linux/macOS installation
      - name: Install Dependencies & Playwright (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps

      # Windows installation
      - name: Install Dependencies & Playwright (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          npm ci
          npx playwright install

      # Run tests
      - name: Run Playwright Tests
        id: run_playwright_tests
        continue-on-error: true
        shell: bash
        run: |
          GREP_ARG=""
          case "${SUITE}" in
            smoke) GREP_ARG='--grep "@Smoke|@smoke"' ;;
            regression) GREP_ARG='--grep "@Regression|@regression"' ;;
            targetedRegression) GREP_ARG='--grep "@TargetedRegression|@targeted"' ;;
            all) GREP_ARG="" ;;
          esac

          npx playwright test --project=${BROWSER} ${GREP_ARG}

      # Rerun failed tests
      - name: Re-run failed Playwright tests
        id: rerun_failed_tests
        if: steps.run_playwright_tests.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          GREP_ARG=""
          case "${SUITE}" in
            smoke) GREP_ARG='--grep "@Smoke|@smoke"' ;;
            regression) GREP_ARG='--grep "@Regression|@regression"' ;;
            targetedRegression) GREP_ARG='--grep "@TargetedRegression|@targeted"' ;;
            all) GREP_ARG="" ;;
          esac

          npx playwright test --last-failed --project=${BROWSER} ${GREP_ARG}

      # Final status evaluation
      - name: Finalize test status
        if: always()
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass

          $initial = "${{ steps.run_playwright_tests.outcome }}"
          $rerun   = "${{ steps.rerun_failed_tests.outcome }}"

          if ($initial -eq "failure" -and $rerun -eq "failure") {
            exit 1
          }
          elseif ($initial -eq "failure" -and $rerun -eq "success") {
            exit 0
          }
          elseif ($initial -eq "success") {
            exit 0
          }
          else {
            exit 0
          }

      # Upload artifacts
      - name: Upload Test Artifacts and Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}-${{ matrix.os }}
          path: |
            results/test-results
            results/playwright-report
          retention-days: 14

      # Summary
      - name: Publish Test Execution Summary
        if: always()
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass

          $initial = "${{ steps.run_playwright_tests.outcome }}"
          $rerun   = "${{ steps.rerun_failed_tests.outcome }}"

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Playwright Test Summary (${{ matrix.os }})"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Property | Value |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| --- | --- |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| OS | `${{ matrix.os }}` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Initial Run | `$initial` |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| Rerun | `$rerun` |"
