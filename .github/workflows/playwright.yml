name: Playwright Test Automation CI/CD

# ==============================================================================
# 1. TRIGGER DEFINITIONS
# ==============================================================================
# - Push / PR triggers execute on main branch.
# - Manual trigger (workflow_dispatch) allows dynamic execution via GitHub UI.
# ==============================================================================
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner Machine / OS (self-hosted, windows-latest, ubuntu-latest, macos-latest)'
        required: true
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - windows-latest
          - ubuntu-latest
          - macos-latest
      environment:
        description: 'Target Execution Environment (dev/test/stage/prod)'
        required: true
        default: 'test'
        type: choice
        options:
          - dev
          - test
          - stage
          - prod
      application:
        description: 'Application / System under test'
        required: true
        default: 'GOOGLE'
        type: string
      device:
        description: 'Device type (desktop/mobile/tablet)'
        required: true
        default: 'desktop'
        type: choice
        options:
          - desktop
          - mobile
          - tablet
      suite:
        description: 'Test Suite Filter (smoke/regression/targetedRegression/all)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - targetedRegression
          - all
      browser:
        description: 'Browser project engine (chromium/chrome/firefox/webkit)'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - chrome
          - firefox
          - webkit

# Prevents redundant parallel workflow runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ============================================================================
  # JOB 1: PLAYWRIGHT AUTOMATED TEST EXECUTION
  # ============================================================================
  playwright-tests:
    name: Execute Playwright Automated Tests

    # Works seamlessly across Windows self-hosted and GitHub-hosted runners.
    runs-on: ${{ inputs.runner || github.event.inputs.runner || 'self-hosted' }}

    timeout-minutes: 120

    env:
      ENV: ${{ inputs.environment || github.event.inputs.environment || 'test' }}
      TEST_ENV: ${{ inputs.environment || github.event.inputs.environment || 'test' }}
      TEST_APP: ${{ inputs.application || github.event.inputs.application || 'GOOGLE' }}
      DEVICE: ${{ inputs.device || github.event.inputs.device || 'desktop' }}
      SUITE: ${{ inputs.suite || github.event.inputs.suite || 'smoke' }}
      BROWSER: ${{ inputs.browser || github.event.inputs.browser || 'chromium' }}
      CI: 'true'

      # Environment Credentials
      DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
      DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      STAGE_USERNAME: ${{ secrets.STAGE_USERNAME }}
      STAGE_PASSWORD: ${{ secrets.STAGE_PASSWORD }}
      PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
      PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ========================================================================
      # 4. SYSTEM & DEPENDENCY SETUP
      # ========================================================================
      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      # ========================================================================
      # 5. INITIAL TEST EXECUTION (CROSS-PLATFORM RUNNER)
      # ========================================================================
      - name: Run Playwright Tests
        id: run_playwright_tests
        continue-on-error: true
        run: node scripts/run-tests.js

      # ========================================================================
      # 6. FAILED-TEST RERUN GATE (CROSS-PLATFORM)
      # ========================================================================
      - name: Re-run failed Playwright tests
        id: rerun_failed_tests
        if: steps.run_playwright_tests.outcome == 'failure'
        continue-on-error: true
        run: node scripts/run-tests.js --rerun

      # ========================================================================
      # 7. FINAL STATUS EVALUATION GATE (CROSS-PLATFORM)
      # ========================================================================
      - name: Finalize test status
        if: always()
        env:
          INITIAL_OUTCOME: ${{ steps.run_playwright_tests.outcome }}
          RERUN_OUTCOME: ${{ steps.rerun_failed_tests.outcome }}
        run: node scripts/finalize-status.js

      # ========================================================================
      # 8. ARTIFACTS AND DEPLOYMENT
      # ========================================================================
      # Upload the HTML report directory as an artifact
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: warn

      # Upload the raw test results (traces, screenshots, videos)
      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 14
          if-no-files-found: warn

      # Deploy report directly to GitHub Pages branch (gh-pages branch via direct git push)
      - name: Deploy Playwright Report to GitHub Pages Branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/deploy-report.js

      # ========================================================================
      # 9. GITHUB STEP SUMMARY GENERATION (CROSS-PLATFORM)
      # ========================================================================
      - name: Publish Test Execution Summary
        if: always()
        env:
          INITIAL_OUTCOME: ${{ steps.run_playwright_tests.outcome }}
          RERUN_OUTCOME: ${{ steps.rerun_failed_tests.outcome }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: node scripts/publish-summary.js

  # ============================================================================
  # JOB 2: DEPLOY REPORT TO GITHUB PAGES (GitHub Actions UI Deployment Job)
  # ============================================================================
  deploy-report:
    name: Deploy Playwright HTML Report
    needs: playwright-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Playwright HTML Report
        uses: actions/download-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report

      - name: Ensure Report Integrity and Assets
        run: node scripts/ensure-report.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Playwright HTML Report to GitHub Pages
        id: upload_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

      - name: Deploy Playwright Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish Live Report Link to Summary
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: node scripts/publish-summary.js --pages-deploy
