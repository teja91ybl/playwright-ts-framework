name: Playwright Test Automation CI/CD

# ==============================================================================
# 1. TRIGGER DEFINITIONS
# ==============================================================================
# UPDATE HERE: Customize triggers according to your project's CI/CD strategy.
# - Push / PR triggers can be configured for specific branches (e.g., main, master, develop).
# - Manual trigger (workflow_dispatch) allows dynamic execution via GitHub UI/API.
# ==============================================================================
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner Machine / OS (self-hosted, windows-latest, ubuntu-latest, macos-latest)'
        required: true
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - windows-latest
          - ubuntu-latest
          - macos-latest
      environment:
        description: 'Target Execution Environment (dev/test/stage/prod)'
        required: true
        default: 'test'
        type: choice
        options:
          - dev
          - test
          - stage
          - prod
      application:
        description: 'Application / System under test'
        required: true
        default: 'GOOGLE'
        type: string
      device:
        description: 'Device type (desktop/mobile/tablet)'
        required: true
        default: 'desktop'
        type: choice
        options:
          - desktop
          - mobile
          - tablet
      suite:
        description: 'Test Suite Filter (smoke/regression/targetedRegression/all)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - targetedRegression
          - all
      browser:
        description: 'Browser project engine (chromium/firefox/webkit)'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

# Prevents redundant parallel workflow runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  playwright-tests:
    name: Execute Playwright Automated Tests

    # ==========================================================================
    # 2. VIRTUAL MACHINE (VM) / RUNNER SELECTION
    # ==========================================================================
    # Configured for Windows Self-Hosted Runner (DESKTOP-1HQ5J38) or UI choice.
    # ==========================================================================
    runs-on: ${{ github.event.inputs.runner || 'self-hosted' }}

    # UPDATE HERE: Adjust overall job timeout limit (in minutes) for long-running suites
    timeout-minutes: 120

    # ==========================================================================
    # 3. USER CREDENTIALS & ENVIRONMENT SECRETS
    # ==========================================================================
    # UPDATE HERE: Map your environment credentials stored in GitHub Repository Secrets.
    # Go to: GitHub Repository -> Settings -> Secrets and variables -> Actions
    # Define credentials matching your targeted environments (DEV, TEST, STAGE, PROD).
    # ==========================================================================
    env:
      # General Environment Configuration
      ENV: ${{ github.event.inputs.environment || 'test' }}
      TEST_ENV: ${{ github.event.inputs.environment || 'test' }}
      TEST_APP: ${{ github.event.inputs.application || 'GOOGLE' }}
      DEVICE: ${{ github.event.inputs.device || 'desktop' }}
      SUITE: ${{ github.event.inputs.suite || 'smoke' }}
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
      CI: true

      # Environment Credentials (Injected securely from Repository Secrets)
      # UPDATE HERE: Add, remove, or rename these secrets to match your system secrets
      DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
      DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      STAGE_USERNAME: ${{ secrets.STAGE_USERNAME }}
      STAGE_PASSWORD: ${{ secrets.STAGE_PASSWORD }}
      PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
      PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}

    defaults:
      run:
        shell: powershell

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ========================================================================
      # 4. SYSTEM & DEPENDENCY SETUP
      # ========================================================================
      # UPDATE HERE: Modify Node version if your project requires a specific runtime.
      # ========================================================================
      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          Write-Host "[INFO] Installing npm dependencies..."
          npm ci

      - name: Install Playwright Browsers
        run: |
          Write-Host "[INFO] Installing Playwright browser binaries..."
          npx playwright install --with-deps
          npx playwright install chrome

      # ========================================================================
      # 5. INITIAL TEST EXECUTION
      # ========================================================================
      - name: Run Playwright Tests
        id: run_playwright_tests
        continue-on-error: true
        run: |
          Write-Host "=================================================="
          Write-Host "STARTING PLAYWRIGHT TEST RUN"
          Write-Host "Machine Name: ${{ runner.name }} ($env:COMPUTERNAME)"
          Write-Host "OS / Arch   : ${{ runner.os }} (${{ runner.arch }})"
          Write-Host "Environment : $env:TEST_ENV"
          Write-Host "Application : $env:TEST_APP"
          Write-Host "Device      : $env:DEVICE"
          Write-Host "Browser     : $env:BROWSER"
          Write-Host "Suite       : $env:SUITE"
          Write-Host "=================================================="

          $GrepArg = ""
          switch ($env:SUITE) {
            "smoke"              { $GrepArg = '--grep "@Smoke|@smoke"' }
            "regression"         { $GrepArg = '--grep "@Regression|@regression"' }
            "targetedRegression" { $GrepArg = '--grep "@TargetedRegression|@targeted"' }
            default              { $GrepArg = "" }
          }

          if ($GrepArg) {
            $cmd = "npx playwright test --project=$env:BROWSER $GrepArg"
          } else {
            $cmd = "npx playwright test --project=$env:BROWSER"
          }

          Write-Host "Executing command: $cmd"
          Invoke-Expression $cmd

      # ========================================================================
      # 6. FAILED-TEST RERUN GATE
      # ========================================================================
      - name: Re-run failed Playwright tests
        id: rerun_failed_tests
        if: steps.run_playwright_tests.outcome == 'failure'
        continue-on-error: true
        run: |
          Write-Host "=================================================="
          Write-Host "RETRYING FAILED TESTS ONLY (--last-failed)"
          Write-Host "=================================================="

          $GrepArg = ""
          switch ($env:SUITE) {
            "smoke"              { $GrepArg = '--grep "@Smoke|@smoke"' }
            "regression"         { $GrepArg = '--grep "@Regression|@regression"' }
            "targetedRegression" { $GrepArg = '--grep "@TargetedRegression|@targeted"' }
            default              { $GrepArg = "" }
          }

          if ($GrepArg) {
           $cmd = "npx playwright test --last-failed --project=$env:BROWSER $GrepArg"
          } else {
           $cmd = "npx playwright test --last-failed --project=$env:BROWSER"
          }

          Write-Host "Executing rerun command: $cmd"
          Invoke-Expression $cmd

      # ========================================================================
      # 7. FINAL STATUS EVALUATION GATE
      # ========================================================================
      - name: Finalize test status
        if: always()
        run: |
          $InitialOutcome = "${{ steps.run_playwright_tests.outcome }}"
          $RerunOutcome = "${{ steps.rerun_failed_tests.outcome }}"
          if (-not $RerunOutcome) { $RerunOutcomeDisplay = "N/A (Skipped)" } else { $RerunOutcomeDisplay = $RerunOutcome }

          Write-Host "=================================================="
          Write-Host "FINAL TEST STATUS EVALUATION"
          Write-Host "Initial Run Outcome : $InitialOutcome"
          Write-Host "Re-run Outcome     : $RerunOutcomeDisplay"
          Write-Host "=================================================="

          if ($InitialOutcome -eq "failure" -and $RerunOutcome -eq "failure") {
            Write-Host "[CRITICAL] Initial test run AND rerun both failed."
            exit 1
          } elseif ($InitialOutcome -eq "failure" -and $RerunOutcome -eq "success") {
            Write-Host "[WARNING] Initial run failed, but rerun passed all failing tests."
            exit 0
          } elseif ($InitialOutcome -eq "success") {
            Write-Host "[SUCCESS] All tests passed on initial execution."
            exit 0
          } else {
            Write-Host "[INFO] Workflow completed with initial outcome: $InitialOutcome"
            exit 0
          }

      # ========================================================================
      # 8. ARTIFACTS AND REPORTING
      # ========================================================================
      # UPDATE HERE: Customize retention days or artifact paths if needed.
      # Default paths: playwright-report, test-results, results
      # ========================================================================
      - name: Upload Test Artifacts and Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            results/playwright-report
            results/test-results
          retention-days: 14

      # ========================================================================
      # 9. GITHUB STEP SUMMARY GENERATION
      # ========================================================================
      - name: Publish Test Execution Summary
        if: always()
        run: |
          $InitialOutcome = "${{ steps.run_playwright_tests.outcome }}"
          $RerunOutcome = "${{ steps.rerun_failed_tests.outcome }}"
          if (-not $RerunOutcome) { $RerunOutcomeDisplay = "N/A" } else { $RerunOutcomeDisplay = $RerunOutcome }

          $MachineName = if ($env:COMPUTERNAME) { $env:COMPUTERNAME } else { $env:HOSTNAME }
          $ReportNote = "[Live Report] View report online via GitHub Pages (Repo -> Settings -> Pages -> Source: GitHub Actions) or download artifact below."

          $SummaryLines = @(
            "### Playwright Test Execution Summary",
            "",
            $ReportNote,
            "",
            "| Property | Value |",
            "| --- | --- |",
            "| **Execution Machine / VM** | ``${{ runner.name }} ($MachineName)`` |",
            "| **OS / Architecture** | ``${{ runner.os }} (${{ runner.arch }})`` |",
            "| **Environment** | $env:TEST_ENV |",
            "| **Application** | $env:TEST_APP |",
            "| **Device** | $env:DEVICE |",
            "| **Suite** | $env:SUITE |",
            "| **Browser** | $env:BROWSER |",
            "| **Initial Run Status** | $InitialOutcome |",
            "| **Re-run Status** | $RerunOutcomeDisplay |",
            "",
            "Artifacts: Check the summary attachments below for detailed HTML reports, JSON results, screenshots, and traces."
          )
          $SummaryText = $SummaryLines -join "`n"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $SummaryText

  # ============================================================================
  # DEDICATED GITHUB PAGES DEPLOYMENT JOB (Runs on GitHub Cloud runner)
  # ============================================================================
  deploy-report:
    name: Deploy Playwright HTML Report
    needs: playwright-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - name: Download Playwright Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: playwright-artifacts

      - name: Prepare Report Directory
        run: |
          mkdir -p playwright-report
          if [ -d "playwright-artifacts/playwright-report" ]; then
            cp -r playwright-artifacts/playwright-report/* playwright-report/
          elif [ -d "playwright-artifacts" ]; then
            cp -r playwright-artifacts/* playwright-report/
          fi
          if [ ! -f "playwright-report/index.html" ]; then
            echo "<html><body><h2>Playwright Test Run Complete</h2><p>Check downloadable artifacts for test execution details.</p></body></html>" > playwright-report/index.html
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Playwright HTML Report to GitHub Pages
        id: upload_pages
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: playwright-report

      - name: Deploy Playwright Report to GitHub Pages
        id: deployment
        if: steps.upload_pages.outcome == 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Publish Live Report Link to Summary
        if: always()
        run: |
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$PAGE_URL" ]; then
            PAGE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          echo "### Live Playwright Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Report URL: $PAGE_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Click here to open Playwright Report in Browser]($PAGE_URL)" >> $GITHUB_STEP_SUMMARY
