name: Playwright Test Automation CI/CD

# ==============================================================================
# 1. TRIGGER DEFINITIONS
# ==============================================================================
# - Push / PR triggers execute on main branch.
# - Manual trigger (workflow_dispatch) allows dynamic execution via GitHub UI.
# ==============================================================================
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner Machine / OS (self-hosted, windows-latest, ubuntu-latest, macos-latest)'
        required: true
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - windows-latest
          - ubuntu-latest
          - macos-latest
      environment:
        description: 'Target Execution Environment (dev/test/stage/prod)'
        required: true
        default: 'test'
        type: choice
        options:
          - dev
          - test
          - stage
          - prod
      application:
        description: 'Application / System under test'
        required: true
        default: 'GOOGLE'
        type: string
      device:
        description: 'Device type (desktop/mobile/tablet)'
        required: true
        default: 'desktop'
        type: choice
        options:
          - desktop
          - mobile
          - tablet
      suite:
        description: 'Test Suite Filter (smoke/regression/targetedRegression/all)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - targetedRegression
          - all
      browser:
        description: 'Browser project engine (chromium/chrome/firefox/webkit)'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - chrome
          - firefox
          - webkit

# Prevents redundant parallel workflow runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ============================================================================
  # JOB 1: PLAYWRIGHT AUTOMATED TEST EXECUTION
  # ============================================================================
  playwright-tests:
    name: Execute Playwright Automated Tests

    # Works seamlessly across Windows self-hosted and GitHub-hosted runners.
    runs-on: ${{ inputs.runner || github.event.inputs.runner || 'self-hosted' }}

    timeout-minutes: 120

    env:
      ENV: ${{ inputs.environment || github.event.inputs.environment || 'test' }}
      TEST_ENV: ${{ inputs.environment || github.event.inputs.environment || 'test' }}
      TEST_APP: ${{ inputs.application || github.event.inputs.application || 'GOOGLE' }}
      DEVICE: ${{ inputs.device || github.event.inputs.device || 'desktop' }}
      SUITE: ${{ inputs.suite || github.event.inputs.suite || 'smoke' }}
      BROWSER: ${{ inputs.browser || github.event.inputs.browser || 'chromium' }}
      CI: 'true'

      # Environment Credentials
      DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
      DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      STAGE_USERNAME: ${{ secrets.STAGE_USERNAME }}
      STAGE_PASSWORD: ${{ secrets.STAGE_PASSWORD }}
      PROD_USERNAME: ${{ secrets.PROD_USERNAME }}
      PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ========================================================================
      # 4. SYSTEM & DEPENDENCY SETUP
      # ========================================================================
      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps

      # ========================================================================
      # 5. INITIAL TEST EXECUTION (CROSS-PLATFORM RUNNER)
      # ========================================================================
      - name: Run Playwright Tests
        id: run_playwright_tests
        continue-on-error: true
        run: |
          node -e "
            const { execSync } = require('child_process');
            const os = require('os');
            console.log('==================================================');
            console.log('STARTING PLAYWRIGHT TEST RUN');
            console.log('Machine Name:', '${{ runner.name }} (' + os.hostname() + ')');
            console.log('OS / Arch   :', '${{ runner.os }} (${{ runner.arch }})');
            console.log('Environment :', process.env.TEST_ENV || 'test');
            console.log('Application :', process.env.TEST_APP || 'GOOGLE');
            console.log('Device      :', process.env.DEVICE || 'desktop');
            console.log('Browser     :', process.env.BROWSER || 'chromium');
            console.log('Suite       :', process.env.SUITE || 'smoke');
            console.log('==================================================');

            const suite = (process.env.SUITE || 'smoke').toLowerCase();
            const browser = (process.env.BROWSER || 'chromium').toLowerCase();
            let grep = '';
            if (suite === 'smoke') grep = '@Smoke|@smoke';
            else if (suite === 'regression') grep = '@Regression|@regression';
            else if (suite === 'targetedregression') grep = '@TargetedRegression|@targeted';

            let cmd = 'npx playwright test';
            if (browser) cmd += ' --project=' + browser;
            if (grep) cmd += ' --grep \"' + grep + '\"';

            console.log('Executing:', cmd);
            try {
              execSync(cmd, { stdio: 'inherit', env: process.env });
              process.exit(0);
            } catch (err) {
              console.error('[ERROR] Playwright tests failed with exit code:', err.status || 1);
              process.exit(err.status || 1);
            }
          "

      # ========================================================================
      # 6. FAILED-TEST RERUN GATE (CROSS-PLATFORM)
      # ========================================================================
      - name: Re-run failed Playwright tests
        id: rerun_failed_tests
        if: steps.run_playwright_tests.outcome == 'failure'
        continue-on-error: true
        run: |
          node -e "
            const { execSync } = require('child_process');
            console.log('==================================================');
            console.log('RETRYING FAILED TESTS ONLY (--last-failed)');
            console.log('==================================================');
            const browser = (process.env.BROWSER || 'chromium').toLowerCase();
            let cmd = 'npx playwright test --last-failed';
            if (browser) cmd += ' --project=' + browser;

            console.log('Executing rerun:', cmd);
            try {
              execSync(cmd, { stdio: 'inherit', env: process.env });
              process.exit(0);
            } catch (err) {
              console.error('[ERROR] Playwright rerun failed with exit code:', err.status || 1);
              process.exit(err.status || 1);
            }
          "

      # ========================================================================
      # 7. FINAL STATUS EVALUATION GATE (CROSS-PLATFORM)
      # ========================================================================
      - name: Finalize test status
        if: always()
        run: |
          node -e "
            const initial = '${{ steps.run_playwright_tests.outcome }}';
            const rerun = '${{ steps.rerun_failed_tests.outcome }}';
            console.log('==================================================');
            console.log('FINAL TEST STATUS EVALUATION');
            console.log('Initial Run Outcome :', initial);
            console.log('Re-run Outcome      :', rerun || 'N/A (Skipped)');
            console.log('==================================================');

            if (initial === 'failure' && rerun === 'failure') {
              console.error('[CRITICAL] Initial test run AND rerun both failed.');
              process.exit(1);
            } else if (initial === 'failure' && rerun === 'success') {
              console.log('[WARNING] Initial run failed, but rerun passed all failing tests.');
              process.exit(0);
            } else if (initial === 'success') {
              console.log('[SUCCESS] All tests passed on initial execution.');
              process.exit(0);
            } else {
              console.log('[INFO] Workflow completed with initial outcome:', initial);
              process.exit(0);
            }
          "

      # ========================================================================
      # 8. ARTIFACTS AND DEPLOYMENT
      # ========================================================================
      # Upload the HTML report directory as an artifact
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: warn

      # Upload the raw test results (traces, screenshots, videos)
      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 14
          if-no-files-found: warn

      # Deploy report directly to GitHub Pages branch (gh-pages branch via direct git push)
      - name: Deploy Playwright Report to GitHub Pages Branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/deploy-report.js

      # ========================================================================
      # 9. GITHUB STEP SUMMARY GENERATION (CROSS-PLATFORM)
      # ========================================================================
      - name: Publish Test Execution Summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const os = require('os');
            const initial = '${{ steps.run_playwright_tests.outcome }}';
            const rerun = '${{ steps.rerun_failed_tests.outcome }}' || 'N/A';
            const machine = os.hostname();
            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            if (!summaryFile) process.exit(0);

            const repoFull = process.env.GITHUB_REPOSITORY || '${{ github.repository }}' || '';
            const [owner, repoName] = repoFull.includes('/') ? repoFull.split('/') : ['${{ github.repository_owner }}', 'playwright-ts-framework'];
            const pageUrl = 'https://' + owner + '.github.io/' + repoName + '/';
            const reportNote = '[Live Report] [Click here to open Playwright Report in Browser](' + pageUrl + ')';
            const markdown = [
              '### Playwright Test Execution Summary',
              '',
              reportNote,
              '',
              '| Property | Value |',
              '| --- | --- |',
              '| **Execution Machine / VM** | \`${{ runner.name }} (' + machine + ')\` |',
              '| **OS / Architecture** | \`${{ runner.os }} (${{ runner.arch }})\` |',
              '| **Environment** | ' + (process.env.TEST_ENV || 'test') + ' |',
              '| **Application** | ' + (process.env.TEST_APP || 'GOOGLE') + ' |',
              '| **Device** | ' + (process.env.DEVICE || 'desktop') + ' |',
              '| **Suite** | ' + (process.env.SUITE || 'smoke') + ' |',
              '| **Browser** | ' + (process.env.BROWSER || 'chromium') + ' |',
              '| **Initial Run Status** | ' + initial + ' |',
              '| **Re-run Status** | ' + rerun + ' |',
              '',
              'Artifacts: Download the attached artifacts below for offline viewing, traces, screenshots, and videos.'
            ].join('\n');

            fs.appendFileSync(summaryFile, markdown + '\n');
          "

  # ============================================================================
  # JOB 2: DEPLOY REPORT TO GITHUB PAGES (GitHub Actions UI Deployment Job)
  # ============================================================================
  deploy-report:
    name: Deploy Playwright HTML Report
    needs: playwright-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Playwright HTML Report
        uses: actions/download-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report

      - name: Ensure Report Integrity and Assets
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const targetDir = 'playwright-report';
            if (!fs.existsSync(targetDir)) fs.mkdirSync(targetDir, { recursive: true });
            fs.writeFileSync(path.join(targetDir, '.nojekyll'), '');
            const indexPath = path.join(targetDir, 'index.html');
            if (!fs.existsSync(indexPath) || fs.statSync(indexPath).size === 0) {
              console.warn('Playwright HTML report index.html not found; creating fallback summary.');
              fs.writeFileSync(indexPath, '<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>Playwright Report</title><style>body{font-family:sans-serif;background:#0d1117;color:#c9d1d9;padding:40px;text-align:center}h1{color:#58a6ff}</style></head><body><h1>Playwright Test Run Complete</h1><p>Check workflow artifacts for execution details.</p></body></html>');
            } else {
              console.log('Verified index.html exists, size: ' + fs.statSync(indexPath).size + ' bytes');
            }
          "

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Playwright HTML Report to GitHub Pages
        id: upload_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

      - name: Deploy Playwright Report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish Live Report Link to Summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            if (!summaryFile) process.exit(0);
            const repoFull = '${{ github.repository }}';
            const [owner, repoName] = repoFull.split('/');
            const pageUrl = '${{ steps.deployment.outputs.page_url }}' || ('https://' + owner + '.github.io/' + repoName + '/');
            const content = [
              '### Live Playwright Test Report',
              '',
              '**Report URL:** ' + pageUrl,
              '',
              '[Click here to open Interactive Playwright Report in Browser](' + pageUrl + ')'
            ].join('\n');
            fs.appendFileSync(summaryFile, content + '\n');
          "
